<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escrivaninha · Contos de Ynana</title>
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="temas.css">
<script>
  // aplica o tema antes de desenhar a tela (sem piscar)
  try {
    var r = document.documentElement;
    r.setAttribute("data-paleta", localStorage.getItem("paleta") || "limpo");
    var t = localStorage.getItem("leitura-tam"); if (t) r.setAttribute("data-leitura-tam", t);
    var f = localStorage.getItem("leitura-fonte"); if (f) r.setAttribute("data-leitura-fonte", f);
  } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237a2e3a'/><path d='M9 7h11a3 3 0 0 1 3 3v15H12a3 3 0 0 1-3-3z' fill='%23f4ecdc'/><path d='M13 12h7M13 16h7M13 20h4' stroke='%237a2e3a' stroke-width='1.6' stroke-linecap='round'/></svg>">
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral">
    <div class="marca">
      <div class="selo">Y</div>
      <div>
        <div class="marca-titulo">Contos de Ynana</div>
        <div class="marca-sub">escrivaninha</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-grupo">Escrever</div>
      <a data-view="conversa" class="destaque"><span class="ico">✦</span>Escrever com o Claude</a>
      <a data-view="capitulos"><span class="ico">✎</span>Capítulos<span class="contador" id="n-capitulos"></span></a>

      <div class="nav-grupo">Mundo</div>
      <a data-view="personagens"><span class="ico">☺</span>Personagens<span class="contador" id="n-personagens"></span></a>
      <a data-view="lugares"><span class="ico">⌂</span>Lugares<span class="contador" id="n-lugares"></span></a>
      <a data-view="artefatos"><span class="ico">◆</span>Artefatos<span class="contador" id="n-artefatos"></span></a>
      <a data-view="acontecimentos"><span class="ico">⚑</span>Acontecimentos<span class="contador" id="n-acontecimentos"></span></a>
      <a data-view="calendario"><span class="ico">☾</span>Calendário</a>

      <div class="nav-grupo">Ofício</div>
      <a data-view="estilo"><span class="ico">¶</span>Estilo</a>
      <a data-view="comandos"><span class="ico">⌘</span>Comandos do Claude</a>
      <a data-view="opcoes"><span class="ico">⚙</span>Opções</a>
    </nav>

    <div class="lateral-rodape">
      <button class="botao-fantasma" id="tema" title="Cores e leitura">◐ cores</button>
      <span class="rede" id="rede"></span>
      <span class="versao" id="versao"></span>
    </div>
  </aside>

  <main class="principal">
    <header class="topo">
      <button class="menu-movel" id="menu-movel" aria-label="Menu">☰</button>
      <div class="busca">
        <span>⌕</span>
        <input id="busca" type="search" placeholder="Buscar em toda a história…  (Ctrl+K)" autocomplete="off">
        <div class="busca-resultados" id="busca-resultados"></div>
      </div>
      <div class="aviso-update" id="aviso-update" hidden></div>
      <div class="salvamento" id="salvamento"></div>
    </header>
    <section class="vista" id="vista"></section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-caixa" id="modal-caixa"></div></div>
<script src="comum.js"></script>
<script src="livro.js"></script>
<script src="slots.js"></script>
<script src="app.js"></script>
<script src="mundo.js"></script>
<script src="escrita.js"></script>
<script src="sociedade.js"></script>
<script src="leitor.js"></script>
<script src="padrao.js"></script>
<script src="opcoes.js"></script>
<script src="exportar.js"></script>
</body>
</html>
